; Firmware for the two ESP32 boards. Both builds read their settings (Wi-Fi,
; MAC addresses, gateway token) from the .env file at the repo root, via
; scripts/load_env.py, so there is nothing to edit in here.
;
;   npm run flash:gateway   /  npm run flash:lcu     (from the repo root)
;   npm run monitor:gateway /  npm run monitor:lcu

[platformio]
src_dir = .
default_envs = gateway, lcu

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/load_env.py
build_flags =
    -I shared
    -D CORE_DEBUG_LEVEL=1

; The board that talks to the server over Wi-Fi and relays alerts and answers,
; then commands the LCU over ESP-NOW when a household accepts.
[env:gateway]
build_src_filter = -<*> +<gateway/>
build_flags =
    ${env.build_flags}
    -I gateway
lib_deps =
    links2004/WebSockets @ ^2.4.0
    bblanchon/ArduinoJson @ ^7.0.0

; The Load Control Unit: drives a TRIAC dimmer to hold the load at the
; commanded level for the commanded window.
[env:lcu]
build_src_filter = -<*> +<lcu/>
build_flags =
    ${env.build_flags}
    -I lcu
lib_deps =
    fabianoriccardi/Dimmable Light for Arduino @ ^1.6.0
; The library declares ArduinoSTL for AVR boards; on ESP32 it breaks the build.
lib_ignore = ArduinoSTL
